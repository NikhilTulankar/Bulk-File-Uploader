[project]
name = "bulk_image_uploader"
authors = [
    { name = "Your Company", email = "admin@example.com" }
]
description = "Bulk upload images to any DocType and link them, with Local or Amazon S3 storage"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "boto3>=1.28.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
